name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # next-env.d.ts is gitignored and carries the `next` type reference that
      # declares `*.css` side-effect imports. TS 6 checks those imports, so tsc
      # must run after next has generated the file.
      - run: npx next build
      - run: npx tsc --noEmit
